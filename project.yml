name: OhMyDock

options:
  bundleIdPrefix: app.ohmydock
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Placeholder: final bundle ID not decided yet. Change only here.
    PRODUCT_BUNDLE_IDENTIFIER: app.ohmydock.OhMyDock
    # Local dev: "Sign to Run Locally" (ad-hoc), no team.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  OhMyDockCore:
    path: Packages/OhMyDockCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

targets:
  OhMyDock:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Helpers
      # Apache-2.0 §4(a): ship dockutil's license + notices inside the app.
      - path: ThirdParty/dockutil/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ThirdParty/dockutil
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: OhMyDockCore
        product: OhMyDockCore
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleName: oh-my-dock
        CFBundleDisplayName: oh-my-dock
        CFBundleShortVersionString: "0.0.1"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_NAME: OhMyDock
        GENERATE_INFOPLIST_FILE: NO
        # Required for notarization (Release). Debug (ad-hoc) builds do not get the runtime flag (flags=0x2(adhoc), not adhoc,runtime), so test hardened-runtime-sensitive behavior on Release builds.
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Embed dockutil
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/App/Resources/Helpers/dockutil
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/dockutil
        script: |
          SRC="$SRCROOT/App/Resources/Helpers/dockutil"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/dockutil"
          if [ -f "$SRC" ]; then
            mkdir -p "$(dirname "$DEST")"
            cp -f "$SRC" "$DEST"
            chmod +x "$DEST"
          else
            # Never leave a stale helper from a previous build in the bundle.
            rm -f "$DEST"
            if [ "$CONFIGURATION" = "Release" ] || [ "$ACTION" = "install" ]; then
              echo "error: dockutil not built — run make dockutil"
              exit 1
            fi
            echo "warning: dockutil not built — run make dockutil"
          fi

  # Unhosted: compiles the view-model sources directly instead of launching the app, so tests
  # never start the menu bar app (and its first-launch capture of the live Dock).
  OhMyDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
      - path: App/Services
      - path: App/ViewModels
      - path: App/Editor
      - path: App/Settings
    dependencies:
      - package: OhMyDockCore
        product: OhMyDockCore
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.ohmydock.OhMyDockTests
        ENABLE_TESTING_SEARCH_PATHS: YES

schemes:
  OhMyDock:
    build:
      targets:
        OhMyDock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OhMyDockTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
