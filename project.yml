name: OhMyDock

options:
  bundleIdPrefix: io.github.farzin-firoozi
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Placeholder: final bundle ID not decided yet. Change only here.
    PRODUCT_BUNDLE_IDENTIFIER: io.github.farzin-firoozi.OhMyDock
    # Local dev: "Sign to Run Locally" (ad-hoc), no team.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  OhMyDockCore:
    path: Packages/OhMyDockCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  ArgumentParser:
    url: https://github.com/apple/swift-argument-parser
    from: 1.5.0

targets:
  OhMyDock:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Helpers
      # Apache-2.0 §4(a): ship dockutil's license + notices inside the app.
      - path: ThirdParty/dockutil/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ThirdParty/dockutil
      # MIT: ship KeyboardShortcuts' license with the app.
      - path: ThirdParty/KeyboardShortcuts/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ThirdParty/KeyboardShortcuts
      - path: ThirdParty/swift-argument-parser/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: ThirdParty/swift-argument-parser
      - path: CLI/ohmydock.1
        buildPhase:
          copyFiles:
            destination: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: ohmydock
      - package: OhMyDockCore
        product: OhMyDockCore
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleName: oh-my-dock
        CFBundleDisplayName: oh-my-dock
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleURLTypes:
          - CFBundleURLName: io.github.farzin-firoozi.OhMyDock
            CFBundleURLSchemes:
              - ohmydock
    settings:
      base:
        PRODUCT_NAME: OhMyDock
        PRODUCT_MODULE_NAME: OhMyDockApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Required for notarization (Release). Debug (ad-hoc) builds do not get the runtime flag (flags=0x2(adhoc), not adhoc,runtime), so test hardened-runtime-sensitive behavior on Release builds.
        ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Embed dockutil
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/App/Resources/Helpers/dockutil
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/dockutil
        script: |
          SRC="$SRCROOT/App/Resources/Helpers/dockutil"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/dockutil"
          if [ -f "$SRC" ]; then
            mkdir -p "$(dirname "$DEST")"
            cp -f "$SRC" "$DEST"
            chmod +x "$DEST"
          else
            # Never leave a stale helper from a previous build in the bundle.
            rm -f "$DEST"
            if [ "$CONFIGURATION" = "Release" ] || [ "$ACTION" = "install" ]; then
              echo "error: dockutil not built — run make dockutil"
              exit 1
            fi
            echo "warning: dockutil not built — run make dockutil"
          fi
      - name: Embed ohmydock CLI
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/ohmydock
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ohmydock
        script: |
          SRC="$BUILT_PRODUCTS_DIR/ohmydock"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/ohmydock"
          if [ -f "$SRC" ]; then
            mkdir -p "$(dirname "$DEST")"
            cp -f "$SRC" "$DEST"
            chmod +x "$DEST"
          else
            rm -f "$DEST"
            if [ "$CONFIGURATION" = "Release" ] || [ "$ACTION" = "install" ]; then
              echo "error: ohmydock not built — run make cli"
              exit 1
            fi
            echo "warning: ohmydock not built — run make cli"
          fi

  ohmydock:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: OhMyDockCore
        product: OhMyDockCore
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        PRODUCT_NAME: ohmydock
        PRODUCT_MODULE_NAME: ohmydock
        TARGET_TEMP_DIR: $(CONFIGURATION_TEMP_DIR)/ohmydock-cli.build
        ENABLE_HARDENED_RUNTIME: YES

  CLITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CLITests
      - path: CLI
        excludes:
          - main.swift
    dependencies:
      - package: OhMyDockCore
        product: OhMyDockCore
      - package: ArgumentParser
        product: ArgumentParser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.farzin-firoozi.CLITests
        ENABLE_TESTING_SEARCH_PATHS: YES

  # Unhosted: compiles the view-model sources directly instead of launching the app, so tests
  # never start the menu bar app (and its first-launch capture of the live Dock).
  OhMyDockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
      - path: App/Services
      - path: App/ViewModels
      - path: App/Editor
      - path: App/Settings
      - path: App/Updates
      - path: App/Sheets
      - path: App/URL
      - path: App/Intents
    dependencies:
      - package: OhMyDockCore
        product: OhMyDockCore
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.farzin-firoozi.OhMyDockTests
        ENABLE_TESTING_SEARCH_PATHS: YES

schemes:
  OhMyDock:
    build:
      targets:
        OhMyDock: all
        ohmydock: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OhMyDockTests
        - CLITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
